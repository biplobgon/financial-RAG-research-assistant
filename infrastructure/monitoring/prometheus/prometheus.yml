# Prometheus Configuration — Financial RAG Research Assistant
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'financial-rag-research-assistant'
    environment: 'production'

scrape_configs:
  - job_name: 'financial-rag-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'chromadb'
    static_configs:
      - targets: ['chromadb:8001']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
